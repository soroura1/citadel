# citadel — a stock Caddy serving bytes built in CI. No Node on the server.
#
# The pipeline runs `vite build` at the gated SHA and ships `dist`. Nothing is
# compiled here, so "green in CI, broken in the image" has no room to happen:
# the artifact CI tested is the artifact that is served.
#
# ⚠️ SHARED VPS. Every name and port below is unique to this platform. Compose
# prefixes resources with the project name, so a collision lets one platform
# operate another's containers.
#
#   project name  citadel-web        (not "citadel" - checklist-api's stack)
#   host port     8087               (8085 taken by another platform's adminer,
#                                     8086 is checklist-api's api-router)
#   bind          172.17.0.1         private docker bridge, NEVER 0.0.0.0
#
# Binding 0.0.0.0 would publish the app over plain HTTP on the public interface
# and let anyone bypass the proxy that terminates TLS.

name: citadel-web

services:
  # ---------------------------------------------------------------------------
  # There is NO db service here, deliberately.
  #
  # `D3` — one database per service — is satisfied by `db-citadel`, a dedicated
  # Postgres instance in the SERVER-OWNED stack at /opt/citadel. This project
  # joins that network and uses it.
  #
  # ⚠️ Defining a db here instead would put citadel's data OUTSIDE
  # /opt/citadel/backup.sh and outside the restore rehearsal — the nightly job
  # would back up the now-unused db-citadel and go green forever while the real
  # data went unprotected. That is the failure this arrangement prevents, and it
  # is why the databases are infrastructure (server-owned, persistent) rather
  # than part of a CI-owned release that a bad deploy could take with it.
  #
  # checklist-api does the same thing, for the same reason.
  # ---------------------------------------------------------------------------

  # One-shot. Run by deploy.sh BEFORE the app restarts — the only thing that
  # touches the schema.
  migrate:
    image: node:26-alpine
    profiles: ["tools"]
    networks: [citadel]
    environment:
      DB_HOST: db-citadel
      DB_PORT: "5432"
      DB_NAME: citadel
      OWNER_DB_USER: postgres
      OWNER_DB_PASSWORD: ${OWNER_DB_PASSWORD:?}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?}
    volumes:
      - ./migrations:/app/migrations:ro
      - ./scripts:/app/scripts:ro
    working_dir: /app
    command: ["node", "scripts/migrate.js"]

  web:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      # Where /api/* is proxied. Read from .env, which is VPS-owned.
      API_UPSTREAM: ${API_UPSTREAM:-172.17.0.1:8086}
    networks: [citadel]
    volumes:
      - ./citadel.Caddyfile:/etc/caddy/Caddyfile:ro
      - ./dist:/srv:ro
    ports:
      - "${HOST_BIND_IP:-172.17.0.1}:${HOST_APP_PORT:-8087}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3

# The database lives in the server-owned stack at /opt/citadel, which creates
# this network. `external: true` means compose JOINS it and never creates it —
# so a deploy cannot silently stand up a second, empty, unbacked database.
networks:
  citadel:
    external: true
    name: citadel_citadel
