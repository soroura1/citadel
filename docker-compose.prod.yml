# citadel — a stock Caddy serving bytes built in CI. No Node on the server.
#
# The pipeline runs `vite build` at the gated SHA and ships `dist`. Nothing is
# compiled here, so "green in CI, broken in the image" has no room to happen:
# the artifact CI tested is the artifact that is served.
#
# ⚠️ SHARED VPS. Every name and port below is unique to this platform. Compose
# prefixes resources with the project name, so a collision lets one platform
# operate another's containers.
#
#   project name  citadel-web        (not "citadel" - checklist-api's stack)
#   host port     8087               (8085 taken by another platform's adminer,
#                                     8086 is checklist-api's api-router)
#   bind          172.17.0.1         private docker bridge, NEVER 0.0.0.0
#
# Binding 0.0.0.0 would publish the app over plain HTTP on the public interface
# and let anyone bypass the proxy that terminates TLS.

name: citadel-web

services:
  # ---------------------------------------------------------------------------
  # citadel's own database — R3 Phase D.
  #
  # ⚠️ ONE DATABASE PER SERVICE. A shared instance is a shared dependency
  # wearing a disguise, and the first time one service's migration blocks
  # another's deploy the cost becomes obvious.
  #
  # Bound to the private bridge only. It is never published publicly, and
  # nothing outside this compose project reaches it.
  # ---------------------------------------------------------------------------
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${OWNER_DB_PASSWORD:?OWNER_DB_PASSWORD is required}
      POSTGRES_DB: citadel
    volumes:
      - citadel_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot. Run by deploy.sh BEFORE the app restarts — the only thing that
  # touches the schema.
  migrate:
    image: node:26-alpine
    profiles: ["tools"]
    depends_on:
      db: { condition: service_healthy }
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: citadel
      OWNER_DB_USER: postgres
      OWNER_DB_PASSWORD: ${OWNER_DB_PASSWORD:?}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?}
    volumes:
      - ./migrations:/app/migrations:ro
      - ./scripts:/app/scripts:ro
    working_dir: /app
    command: ["node", "scripts/migrate.js"]

  web:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      # Where /api/* is proxied. Read from .env, which is VPS-owned.
      API_UPSTREAM: ${API_UPSTREAM:-172.17.0.1:8086}
    volumes:
      - ./citadel.Caddyfile:/etc/caddy/Caddyfile:ro
      - ./dist:/srv:ro
    ports:
      - "${HOST_BIND_IP:-172.17.0.1}:${HOST_APP_PORT:-8087}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  citadel_db: {}
